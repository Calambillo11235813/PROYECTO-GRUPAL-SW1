version: "3.8"

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:14
    container_name: proyecto_sw1_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-proyecto_sw1}
      - POSTGRES_USER=${POSTGRES_USER:-sw1_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sw1_password}
    ports:
      - "5435:5432"
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sw1_user} -d ${POSTGRES_DB:-proyecto_sw1}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Django
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: proyecto_sw1_backend
    volumes:
      - ./Backend:/app
      - backend_media:/app/media
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - POSTGRES_DB=${POSTGRES_DB:-proyecto_sw1}
      - POSTGRES_USER=${POSTGRES_USER:-sw1_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sw1_password}
      - DB_HOST=db
      - DB_PORT=5432
      - CODE_DETECTOR_FORCE_FALLBACK=0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proyecto_sw1_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_media:
  backend_logs:
